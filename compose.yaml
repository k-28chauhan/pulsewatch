# The whole of PulseWatch in one command:
#
#     docker compose up --build
#
# then open http://localhost:8088 and create an account.
#   Emails the app sends (down/recovered alerts) land in Mailpit:  http://localhost:8025
#   Dashboards:                                                    http://localhost:3001  (Grafana, no login)
#   A local website to monitor (always 200 / 500 / slow):          http://httpbin:8080/status/200  (inside the stack)
#
# Developing the code instead? Start only the supporting services and run the app and the UI on your machine:
#
#     docker compose up -d postgres httpbin mailpit prometheus grafana
#     ./mvnw spring-boot:run          (API on :8080)
#     cd frontend && npm run dev      (UI on :5173)
#
# Everything below is LOCAL DEFAULTS (known passwords, no TLS, anonymous Grafana). For a real server use deploy/compose.prod.yaml.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pulsewatch
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Spring Boot API. Built from ./Dockerfile.
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulsewatch
      SPRING_MAIL_HOST: mailpit
      # Local only, so you can monitor the httpbin container. The SSRF guard forbids private addresses by default.
      PULSEWATCH_CHECK_ALLOW_PRIVATE_TARGETS: "true"
      # Local only. Production must set its own long random secret (see deploy/compose.prod.yaml).
      PULSEWATCH_SECURITY_JWT_SECRET: ${JWT_SECRET:-local-compose-secret-do-not-use-in-production-0123456789}
      SERVER_FORWARD_HEADERS_STRATEGY: framework   # trust X-Forwarded-For from the web container (rate limiting uses the client IP)
    ports:
      - "8080:8080"

  # The React UI, served by Caddy, which also forwards /api to the app.
  web:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"

  # A local test target for monitors. From inside the stack: http://httpbin:8080/status/200, /status/500, /delay/8
  # From your machine: http://localhost:8081/...
  httpbin:
    image: mccutchen/go-httpbin
    ports:
      - "8081:8080"

  # Catches every email the app sends, so nothing real is ever delivered.
  #   SMTP: localhost:1025   Inbox UI: http://localhost:8025   API: http://localhost:8025/api/v1/messages
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Metrics. Prometheus scrapes the app every 5 s; Grafana draws the pre-built "PulseWatch" dashboard.
  #   Prometheus: http://localhost:9090      Grafana: http://localhost:3001 (no login: LOCAL DEVELOPMENT ONLY)
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach an app running on your machine (needed on Linux)

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pulsewatch.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
